<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Originality & Content Quality Checker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #f5f7fa;
      color: #222;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    textarea {
      width: 100%;
      min-height: 300px;
      padding: 15px;
      font-size: 16px;
      line-height: 1.6;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      resize: vertical;
    }

    button {
      margin-top: 15px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #24292f;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    #results {
      display: none;
      margin-top: 30px;
      background: white;
      padding: 25px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }

    .score {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .stat {
      padding: 15px;
      background: #f5f7fa;
      border-radius: 8px;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      margin-top: 5px;
    }

    .warnings {
      margin-top: 20px;
    }

    .warnings li {
      margin-bottom: 8px;
    }
  </style>
</head>

<body>

  <h1>Originality & Content Quality Checker</h1>

  <p class="subtitle">
    Analyze your content using transparent, deterministic checks.
  </p>

  <textarea
    id="content"
    placeholder="Paste your content here..."
  ></textarea>

  <button onclick="analyzeContent()">Analyze Content</button>

  <section id="results">

    <div class="score">
      Quality Score: <span id="score">0</span>/100
    </div>

    <div class="stats">

      <div class="stat">
        Word Count
        <strong id="wordCount">0</strong>
      </div>

      <div class="stat">
        Sentence Count
        <strong id="sentenceCount">0</strong>
      </div>

      <div class="stat">
        Average Sentence Length
        <strong id="avgSentenceLength">0</strong>
      </div>

      <div class="stat">
        Repeated Words
        <strong id="repeatedWords">0</strong>
      </div>

    </div>

    <div class="warnings">
      <h3>Analysis Notes</h3>
      <ul id="notes"></ul>
    </div>

  </section>

  <script>
    function analyzeContent() {

      const text = document.getElementById("content").value.trim();

      if (!text) {
        alert("Please enter some content first.");
        return;
      }

      const words = text.match(/\b[\w'-]+\b/g) || [];

      const sentences = text
        .split(/[.!?]+/)
        .map(sentence => sentence.trim())
        .filter(sentence => sentence.length > 0);

      const wordCount = words.length;
      const sentenceCount = sentences.length;

      const avgSentenceLength =
        sentenceCount > 0
          ? wordCount / sentenceCount
          : 0;

      const frequency = {};

      words.forEach(word => {

        const cleanWord = word.toLowerCase();

        frequency[cleanWord] =
          (frequency[cleanWord] || 0) + 1;

      });

      const repeatedWords = Object.values(frequency)
        .filter(count => count >= 3)
        .length;

      let score = 100;
      const notes = [];

      if (avgSentenceLength > 25) {
        score -= 10;
        notes.push(
          "Some sentences may be longer than recommended."
        );
      }

      if (repeatedWords > 10) {
        score -= 10;
        notes.push(
          "Several words appear repeatedly."
        );
      }

      if (wordCount < 100) {
        score -= 10;
        notes.push(
          "The content is quite short for a detailed analysis."
        );
      }

      if (notes.length === 0) {
        notes.push(
          "No major issues were detected by these basic checks."
        );
      }

      score = Math.max(0, score);

      document.getElementById("score").textContent = score;
      document.getElementById("wordCount").textContent = wordCount;
      document.getElementById("sentenceCount").textContent = sentenceCount;
      document.getElementById("avgSentenceLength").textContent =
        avgSentenceLength.toFixed(1);
      document.getElementById("repeatedWords").textContent =
        repeatedWords;

      const notesList = document.getElementById("notes");

      notesList.innerHTML = "";

      notes.forEach(note => {

        const li = document.createElement("li");

        li.textContent = note;

        notesList.appendChild(li);

      });

      document.getElementById("results").style.display = "block";
    }
  </script>

</body>
</html>
